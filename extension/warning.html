<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PhishGuard Warning</title>
<link rel="stylesheet" href="warning.css">
</head>
<body>
<div class="container">

    <div class="warning-card">
        <div class="icon">⚠️</div>
        <h1 class="title">Phishing Alert Detected</h1>
        <p class="subtitle">This website is likely a phishing page and may be unsafe.</p>

        <div class="info-box">
            <div id="prob" class="prob-text"></div>
        </div>

        <div class="actions">
            <button class="safe-btn" id="closeBtn">Close Window</button>
        </div>
    </div>

</div>

<script src="warning.js"></script>
</body>
</html>
